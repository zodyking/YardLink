# Yard Link — self-hosted in one command:
#
#   docker compose up -d
#
# Then open http://<this-computer>:3847 and follow the setup wizard.
#
# There is nothing to configure in this file and no .env to write. The
# database password and session secret are generated on first start and kept
# in the `yardlink-secrets` volume; company details, the first dispatcher
# account and every other setting are entered in the web app.
#
# Your data lives in three volumes — back these up:
#   yardlink-db       the database
#   yardlink-data     photos and documents
#   yardlink-secrets  generated passwords (needed to read the database)

name: yardlink

services:
  # Makes the passwords once, then exits.
  secrets:
    image: alpine:3.20
    restart: "no"
    volumes:
      - yardlink-secrets:/run/yardlink
    command:
      - sh
      - -c
      - |
        set -eu
        make() {
          if [ ! -s "/run/yardlink/$$1" ]; then
            head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "/run/yardlink/$$1"
            echo "[secrets] generated $$1"
          fi
          chmod 444 "/run/yardlink/$$1"
        }
        make db-password
        make session-secret

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: yardlink
      POSTGRES_DB: yardlink
      POSTGRES_PASSWORD_FILE: /run/yardlink/db-password
    volumes:
      - yardlink-db:/var/lib/postgresql/data
      - yardlink-secrets:/run/yardlink:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yardlink -d yardlink"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the app talks to the database.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yardlink:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3847:3847"
    volumes:
      - yardlink-data:/data
      - yardlink-secrets:/run/yardlink:ro

volumes:
  yardlink-db:
  yardlink-data:
  yardlink-secrets:
